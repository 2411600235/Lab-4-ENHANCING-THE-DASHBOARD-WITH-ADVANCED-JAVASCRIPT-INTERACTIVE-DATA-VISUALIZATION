<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal | Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
      <div class="card login-card shadow-lg">
        <div class="card-header text-center">
          <div class="brand-mark">SP</div>
          <h2 class="mb-1">Student Portal</h2>
          <p class="mb-0">Login to your dashboard</p>
        </div>

        <div class="card-body p-4">
          <div id="loginFeedback" aria-live="polite"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="Enter username"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter password"
                required
              />
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
              Login
            </button>
          </form>

          <div class="text-center mt-3">
            <small class="text-muted">Demo 2411600235/ 2411600235Ian</small>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
